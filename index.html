<style>
  :root{
    --brand-black:#17140F;
    --orange-900:#0E0C09;
    --orange-800:#17140F;
    --orange-700:#B98A0A;
    --orange-600:#F2C230;
    --orange-500:#F5D666;
    --orange-200:#FBEAA9;
    --orange-100:#FDF3D2;
    --orange-50:#FFFCF2;
    --white:#FFFFFF;
    --ink:#1A1613;
    --ink-soft:#5C5548;
    --ink-faint:#948C7C;
    --line:#EDE6D0;
    --line-strong:#E0D6B0;
    --class-1:#5E8F6D; --class-1-bg:#EAF3EC;
    --class-2:#C98A17; --class-2-bg:#FBF0DC;
    --class-3:#D4560F; --class-3-bg:#FDECE0;
    --class-4:#9C2B2B; --class-4-bg:#F8E6E6;
    --stage-pra:#5C6B8A;      --stage-pra-bg:#EAEDF5;
    --stage-dalam:#B98A0A;    --stage-dalam-bg:#FDF3D2;
    --stage-tc:#17140F;       --stage-tc-bg:#E7E4DC;
    --stage-selesai:#5E8F6D;  --stage-selesai-bg:#EAF3EC;
    --radius:10px;
    --shadow:0 1px 2px rgba(23,20,15,0.08), 0 4px 14px rgba(23,20,15,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:linear-gradient(160deg,#F2C230,#D9A812);-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4,.stat-num{font-family:'Space Grotesk',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--orange-200);}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .hazard-strip{height:7px;background:repeating-linear-gradient(-45deg,var(--orange-600) 0 14px,var(--brand-black) 14px 28px);flex-shrink:0;position:sticky;top:0;z-index:21;}

  header.topbar{background:var(--white);padding:18px 28px 0 28px;position:sticky;top:7px;z-index:20;}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:0 auto;flex-wrap:wrap;gap:10px;padding-bottom:14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:40px;height:40px;border-radius:9px;background:linear-gradient(155deg,var(--orange-600),var(--brand-black));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:22px;height:22px;}
  .brand-text h1{margin:0;font-size:19px;font-weight:700;color:var(--ink);}
  .brand-text p{margin:1px 0 0 0;font-size:12.5px;color:var(--ink-soft);}
  .header-right{display:flex;align-items:center;gap:14px;}
  .share-note{font-size:11.5px;color:var(--ink-faint);display:flex;align-items:center;gap:6px;}
  .share-note svg{width:13px;height:13px;flex-shrink:0;}
  .gear-btn{background:none;border:1px solid var(--line-strong);border-radius:7px;padding:6px 9px;color:var(--ink-soft);font-size:15px;line-height:1;}
  .gear-btn:hover{border-color:var(--orange-600);color:var(--orange-800);}
  nav.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;}
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{border:none;background:none;padding:10px 16px 12px 16px;font-size:14px;font-weight:600;color:var(--ink-soft);border-bottom:2.5px solid transparent;white-space:nowrap;}
  .tab-btn:hover{color:var(--orange-700);}
  .tab-btn.active{color:var(--orange-800);border-bottom-color:var(--orange-600);}
  main{flex:1;max-width:1180px;margin:0 auto;padding:28px;width:100%;}
  footer.app-footer{background:var(--white);text-align:center;padding:18px;font-size:11.5px;color:var(--ink-faint);border-top:1px solid var(--line);}

  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .section-title{font-size:13px;font-weight:700;color:var(--orange-800);text-transform:uppercase;letter-spacing:0.06em;margin:0 0 4px 0;}
  .section-sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 18px 0;}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:8px;border:1px solid transparent;font-size:14px;font-weight:600;}
  .btn-primary{background:var(--orange-600);color:var(--brand-black);}
  .btn-primary:hover{background:var(--orange-700);color:var(--white);}
  .btn-outline{background:var(--white);border-color:var(--line-strong);color:var(--ink);}
  .btn-outline:hover{border-color:var(--orange-600);color:var(--orange-800);}
  .btn-ghost{background:transparent;color:var(--ink-soft);padding:8px 12px;}
  .btn-ghost:hover{color:var(--orange-800);}
  .btn-danger-ghost{background:transparent;color:#9C2B2B;padding:8px 12px;font-size:13px;font-weight:600;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  label.field-label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .field-hint{font-size:12px;color:var(--ink-faint);margin-top:4px;}
  input[type=text],input[type=date],input[type=tel],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;font-size:14px;color:var(--ink);background:var(--white);}
  input[type=file]{width:100%;font-size:13px;padding:8px;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--orange-50);}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--orange-600);outline-offset:1px;border-color:var(--orange-600);}
  textarea{resize:vertical;min-height:70px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:640px){.form-grid,.form-grid.cols-3{grid-template-columns:1fr;}}
  .field{margin-bottom:16px;}
  .upload-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .upload-status{font-size:12px;color:var(--class-1);}
  .checkbox-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .check-chip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line-strong);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .check-chip input{width:auto;}
  .check-chip.checked{border-color:var(--orange-600);background:var(--orange-50);}

  .pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
  .pill-pra{background:var(--stage-pra-bg);color:var(--stage-pra);}
  .pill-dalam{background:var(--stage-dalam-bg);color:var(--stage-dalam);}
  .pill-tc{background:var(--stage-tc-bg);color:var(--stage-tc);}
  .pill-selesai{background:var(--stage-selesai-bg);color:var(--stage-selesai);}

  .class-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:700;}
  .class-badge.c-I{background:var(--class-1-bg);color:var(--class-1);}
  .class-badge.c-II{background:var(--class-2-bg);color:var(--class-2);}
  .class-badge.c-III{background:var(--class-3-bg);color:var(--class-3);}
  .class-badge.c-IV{background:var(--class-4-bg);color:var(--class-4);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state svg{width:44px;height:44px;color:var(--orange-500);margin-bottom:12px;}
  .empty-state h3{margin:0 0 6px 0;font-size:16px;color:var(--ink);}
  .empty-state p{margin:0 0 18px 0;font-size:13.5px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand-black);color:var(--orange-500);padding:11px 20px;border-radius:8px;font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.25);z-index:200;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;max-width:80vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
  @media(max-width:900px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat-card{padding:16px;}
  .stat-num{font-size:26px;font-weight:700;color:var(--ink);line-height:1;}
  .stat-label{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .stat-card.accent{border-left:4px solid var(--orange-600);}

  .filter-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .filter-row select,.filter-row input{width:auto;min-width:130px;}
  .search-box{flex:1;min-width:180px;}
  .toggle-group{display:flex;flex-wrap:wrap;gap:6px;}
  .toggle-btn{padding:9px 14px;font-size:13px;font-weight:600;background:var(--white);color:var(--ink-soft);border:1.5px solid var(--line-strong);border-radius:8px;white-space:normal;flex:1 1 110px;text-align:center;}
  .toggle-btn.active{background:var(--orange-600);color:var(--brand-black);}

  .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .proj-card{padding:16px 18px;cursor:pointer;border-left:4px solid var(--line);}
  .proj-card.s-PRA{border-left-color:var(--stage-pra);}
  .proj-card.s-DALAM{border-left-color:var(--stage-dalam);}
  .proj-card.s-TC{border-left-color:var(--stage-tc);}
  .proj-card.s-SELESAI{border-left-color:var(--stage-selesai);}
  .proj-card:hover{box-shadow:0 4px 18px rgba(23,20,15,0.12);}
  .proj-card h4{margin:0 0 3px 0;font-size:15px;}
  .proj-card .scope{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px 0;line-height:1.4;}
  .proj-card .meta{font-size:11.5px;color:var(--ink-faint);}
  .proj-card .badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.choice-grid{grid-template-columns:1fr;}}
  .choice-card{border:1.5px solid var(--line-strong);border-radius:var(--radius);padding:14px 16px;text-align:left;background:var(--white);}
  .choice-card:hover{border-color:var(--orange-600);}
  .choice-card.selected{border-color:var(--orange-600);background:var(--orange-50);}
  .choice-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
  .choice-letter{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .choice-title{font-weight:700;font-size:14px;color:var(--ink);}
  .choice-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0;}
  .choice-examples{font-size:12px;color:var(--ink-faint);margin-top:6px;line-height:1.5;}

  .matrix-result{margin-top:20px;padding:18px;border-radius:var(--radius);background:var(--orange-50);border:1px dashed var(--orange-600);}
  .matrix-result.empty{color:var(--ink-faint);font-size:13.5px;text-align:center;}
  .class-options{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .class-opt-btn{padding:9px 16px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--white);font-weight:700;font-size:13.5px;}
  .class-opt-btn.chosen{border-color:var(--orange-600);background:var(--orange-600);color:var(--brand-black);}

  .precaution-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px;}
  @media(max-width:640px){.precaution-cols{grid-template-columns:1fr;}}
  .precaution-cols h4{margin:0 0 8px 0;font-size:12.5px;color:var(--orange-800);text-transform:uppercase;letter-spacing:.04em;}
  .precaution-cols ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink);line-height:1.65;}

  table.matrix-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.matrix-table th,table.matrix-table td{border:1px solid var(--line);padding:10px 12px;text-align:center;}
  table.matrix-table th{background:var(--orange-50);color:var(--orange-800);font-weight:700;}
  table.matrix-table td:first-child,table.matrix-table th:first-child{text-align:left;font-weight:600;}

  .detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;}
  @media(max-width:900px){.detail-grid{grid-template-columns:1fr;}}
  .info-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .info-row:last-child{border-bottom:none;}
  .info-row .k{color:var(--ink-soft);}
  .info-row .v{font-weight:600;color:var(--ink);text-align:right;}

  .stage-track{display:flex;align-items:center;gap:0;margin-bottom:20px;}
  .stage-step{flex:1;text-align:center;position:relative;}
  .stage-dot{width:28px;height:28px;border-radius:50%;background:var(--line);color:var(--ink-faint);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:0 auto 6px auto;position:relative;z-index:2;}
  .stage-step.done .stage-dot{background:var(--orange-600);color:var(--brand-black);}
  .stage-step.current .stage-dot{background:var(--white);border:2.5px solid var(--orange-600);color:var(--orange-800);}
  .stage-line{position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line);z-index:1;}
  .stage-step.done .stage-line{background:var(--orange-600);}
  .stage-step:first-child .stage-line{display:none;}
  .stage-label{font-size:11px;color:var(--ink-soft);font-weight:600;}

  .visit-card{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;}
  .finding-block{border:1px dashed var(--line-strong);border-radius:8px;padding:12px;margin-bottom:10px;}
  .photo-thumb-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .photo-thumb{width:64px;height:64px;border-radius:6px;object-fit:cover;border:1px solid var(--line-strong);}
  .attach-link{font-size:12.5px;color:var(--orange-700);text-decoration:none;font-weight:600;}
  .attach-link:hover{text-decoration:underline;}

  #printArea{display:none;}
  @media print{
    body.printing > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;padding:20px;font-family:'Inter',sans-serif;}
    #printArea h2{font-family:'Space Grotesk',sans-serif;}
  }
  @media (max-width:640px){
    header.topbar{padding:14px 16px 0 16px;}
    main{padding:16px;}
    .stat-row{grid-template-columns:1fr 1fr;}
  }
</style>
</head>

<div id="printArea"></div>
<div class="toast" id="toast"></div>

const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbyTIQAp6VMNJhikNeDtuQ1SmaVFIFiYxM_QoyKjb7dLT6lEF68eVh6HeLOAh-sBpQdF/exec';
let config = { gasUrl: DEFAULT_GAS_URL };

async function loadConfig(){
  try{
    const res = await window.storage.get(CONFIG_KEY, true);
    if(res && res.value) config = JSON.parse(res.value);
  }catch(e){ /* not configured yet */ }
}
async function saveConfig(){
  await window.storage.set(CONFIG_KEY, JSON.stringify(config), true);
}

/* ============================================================
   API — talks to the deployed Google Apps Script Web App
   ============================================================ */
async function gasList(){
  const res = await fetch(config.gasUrl + '?action=list');
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'List failed');
  return data.projects || [];
}
async function gasSave(project){
  const res = await fetch(config.gasUrl, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'save', project})
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Save failed');
  return data.project;
}
async function gasDelete(id){
  const res = await fetch(config.gasUrl, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'delete', id})
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Delete failed');
}
async function gasUpload(name, mimeType, base64){
  const res = await fetch(config.gasUrl, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'uploadFile', name, mimeType, data:base64})
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Upload failed');
  return data;
}
async function gasFeedback(payload){
  const res = await fetch(config.gasUrl, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action:'feedback'}, payload))
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Feedback failed');
}

/* ---- Local fallback storage (used until Google Sheets is connected) ---- */
const LOCAL_PROJECTS_KEY = 'icra-htpn-projects-v1';
const LOCAL_FEEDBACK_KEY = 'icra-htpn-feedback-v1';
async function localListAll(){
  try{ const res = await window.storage.get(LOCAL_PROJECTS_KEY, true); return res && res.value ? JSON.parse(res.value) : []; }
  catch(e){ return []; }
}
async function localSaveAll(arr){
  const res = await window.storage.set(LOCAL_PROJECTS_KEY, JSON.stringify(arr), true);
  if(!res) throw new Error('Local save failed');
}
async function localSave(project){
  const arr = await localListAll();
  const idx = arr.findIndex(p=>p.id===project.id);
  if(idx>-1) arr[idx]=project; else arr.push(project);
  await localSaveAll(arr);
  return project;
}
async function localDelete(id){
  const arr = (await localListAll()).filter(p=>p.id!==id);
  await localSaveAll(arr);
}
async function localFeedback(payload){
  let arr = [];
  try{ const res = await window.storage.get(LOCAL_FEEDBACK_KEY, true); arr = res && res.value ? JSON.parse(res.value) : []; }catch(e){ arr=[]; }
  arr.push(Object.assign({timestamp:new Date().toISOString()}, payload));
  const res = await window.storage.set(LOCAL_FEEDBACK_KEY, JSON.stringify(arr), true);
  if(!res) throw new Error('Local feedback save failed');
}

/* ---- Dispatch: use Google Sheets if connected, else local storage ---- */
async function apiList(){ return config.gasUrl ? gasList() : localListAll(); }
async function apiSave(project){ return config.gasUrl ? gasSave(project) : localSave(project); }
async function apiDelete(id){ return config.gasUrl ? gasDelete(id) : localDelete(id); }
async function apiUploadFile(name, mimeType, base64){
  if(config.gasUrl) return gasUpload(name, mimeType, base64);
  const dataUrl = 'data:'+mimeType+';base64,'+base64;
  return { ok:true, url:dataUrl, name, thumb:dataUrl };
}
async function apiFeedback(payload){ return config.gasUrl ? gasFeedback(payload) : localFeedback(payload); }

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ---------------- Claude vision helper (auto-read uploads) ---------------- */
async function callClaudeVision(base64, mimeType, promptText){
  const isPdf = mimeType === 'application/pdf';
  const block = isPdf
    ? { type:'document', source:{ type:'base64', media_type:'application/pdf', data:base64 } }
    : { type:'image', source:{ type:'base64', media_type:mimeType, data:base64 } };
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:300,
      messages:[{ role:'user', content:[ block, { type:'text', text:promptText } ] }]
    })
  });
  const data = await resp.json();
  const textBlock = (data.content||[]).find(c=>c.type==='text');
  return textBlock ? textBlock.text.trim() : '';
}

function picChipsHtml(){
  return PIC_OPTIONS.map(name=>{
    const checked = formState.picInCharge.includes(name);
    return `<label class="check-chip ${checked?'checked':''}"><input type="checkbox" ${checked?'checked':''} onchange="togglePic('${name}')">${name}</label>`;
  }).join('');
}
function togglePic(name){
  const i = formState.picInCharge.indexOf(name);
  if(i>-1) formState.picInCharge.splice(i,1); else formState.picInCharge.push(name);
  document.getElementById('pic-grid').innerHTML = picChipsHtml();
}

function activityDescHtml(k){
  const a = ACTIVITY_TYPES[k];
  return `<div class="choice-card selected"><div class="choice-head"><div class="choice-letter" style="${intensityStyleAttr(a.intensity)}">${k}</div><div class="choice-title">${a.title}</div></div><p class="choice-desc">${a.desc}</p></div>`;
}
function selectActivity(k){
  formState.activityType = k || null;
  document.getElementById('activity-desc').innerHTML = k ? activityDescHtml(k) : '';
  recomputeClass();
  document.getElementById('matrix-result').innerHTML = matrixResultHtml();
}

function riskCardHtml(k){
  const r = RISK_GROUPS[k];
  const s = RISK_COLOR_STYLE[k];
  const selected = formState.riskGroup===k;
  return `<button type="button" class="choice-card" style="background:${s.bg};border-color:${selected?s.color:'transparent'};${selected?'border-width:2px;':''}" onclick="selectRisk('${k}')">
      <div class="choice-head"><div class="choice-letter" style="background:#fff;color:${s.color};font-size:10px;">${r.intensity}</div>
      <div class="choice-title" style="color:${s.color};">${r.title}${r.sub?' &middot; '+r.sub:''}</div></div>
      <p class="choice-examples" style="color:${s.color};opacity:0.85;">${r.locations.join(' &middot; ')}</p></button>`;
}
function selectRisk(k){
  formState.riskGroup = k;
  document.getElementById('risk-grid').innerHTML = Object.keys(RISK_GROUPS).map(x=>riskCardHtml(x)).join('');
  recomputeClass();
  document.getElementById('matrix-result').innerHTML = matrixResultHtml();
}
function recomputeClass(){
  const opts = getMatrixOptions(formState.riskGroup, formState.activityType);
  formState.icraClass = (opts && opts.length===1) ? opts[0] : null;
}
function chooseClass(c){ formState.icraClass=c; document.getElementById('matrix-result').innerHTML = matrixResultHtml(); }

function matrixResultHtml(){
  const opts = getMatrixOptions(formState.riskGroup, formState.activityType);
  if(!opts) return `<div class="matrix-result empty">Select an activity type and patient risk group to generate the infection control class. You may also override it manually below once generated.</div>`;
  let body='';
  if(opts.length>1){
    body += `<p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 4px 0;">The matrix suggests Class <strong>${opts.join(' / ')}</strong>. Select the final class based on clinical judgement:</p>
      <div class="class-options">${opts.map(c=>`<button type="button" class="class-opt-btn ${formState.icraClass===c?'chosen':''}" onclick="chooseClass('${c}')">Class ${c}</button>`).join('')}</div>`;
  } else {
    body += `<p style="font-size:13.5px;color:var(--ink-soft);margin:0;">Infection control class set by the matrix (editable if needed):</p>
      <div class="class-options">${['I','II','III','IV'].map(c=>`<button type="button" class="class-opt-btn ${formState.icraClass===c?'chosen':''}" onclick="chooseClass('${c}')">Class ${c}</button>`).join('')}</div>`;
  }
  let checklist='';
  if(formState.icraClass){
    const c = CLASS_PRECAUTIONS[formState.icraClass];
    checklist = `<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line-strong);">
      <span class="class-badge c-${formState.icraClass}" style="font-size:14px;padding:5px 14px;">Class ${formState.icraClass}</span>
      <div class="precaution-cols">
        <div><h4>During Construction</h4><ul>${c.during.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div><h4>Upon Completion</h4><ul>${c.completion.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div></div>`;
  }
  return body+checklist;
}

/* --- file handlers for the Pre form --- */
async function handleMemoUpload(input){
  const file = input.files[0]; if(!file) return;
  document.getElementById('memo-status').innerHTML = `<span class="upload-status">Uploading&hellip;</span>`;
  try{
    const base64 = await fileToBase64(file);
    const res = await apiUploadFile(file.name, file.type, base64);
    formState.memoFile = {name:file.name, url:res.url};
    document.getElementById('memo-status').innerHTML = `<a class="attach-link" href="${res.url}" target="_blank">&#128206; ${esc(file.name)}</a>`;
  }catch(e){ showToast('Upload failed: '+e.message); document.getElementById('memo-status').innerHTML=''; }
}
async function handleGanttUpload(input){
  const file = input.files[0]; if(!file) return;
  document.getElementById('gantt-status').innerHTML = `<span class="upload-status">Uploading &amp; reading schedule&hellip;</span>`;
  try{
    const base64 = await fileToBase64(file);
    const res = await apiUploadFile(file.name, file.type, base64);
    formState.ganttFile = {name:file.name, url:res.url};
    document.getElementById('gantt-status').innerHTML = `<a class="attach-link" href="${res.url}" target="_blank">&#128206; ${esc(file.name)}</a>`;
    try{
      const duration = await callClaudeVision(base64, file.type, 'This image or document shows a construction/renovation project schedule or Gantt chart. Read it and give the total estimated project duration from start to finish as a short phrase (e.g. "3 weeks" or "10 days"). Respond with ONLY the duration phrase, nothing else.');
      if(duration){ formState.anggaranTempoh = duration; document.getElementById('duration-input').value = duration; showToast('Estimated duration filled from schedule — please verify.'); }
    }catch(err){ showToast('Uploaded, but could not auto-read duration. Please fill it in manually.'); }
  }catch(e){ showToast('Upload failed: '+e.message); document.getElementById('gantt-status').innerHTML=''; }
}
async function handleScopeScan(input){
  const file = input.files[0]; if(!file) return;
  document.getElementById('scope-status').textContent = 'Reading photo\u2026';
  try{
    const base64 = await fileToBase64(file);
    const text = await callClaudeVision(base64, file.type, 'This image shows a description of a construction/renovation task or work order for a hospital. Transcribe or summarize the task description in 2-4 clear sentences suitable for an infection control risk assessment form. Respond with ONLY the description text.');
    if(text){
      formState.skopKerja = text;
      document.getElementById('scope-textarea').value = text;
      document.getElementById('scope-status').textContent = 'Filled from photo — please review.';
    } else {
      document.getElementById('scope-status').textContent = 'Could not read the photo. Please type it manually.';
    }
  }catch(e){ document.getElementById('scope-status').textContent = 'Could not read the photo. Please type it manually.'; }
}

async function submitForm(){
  const f = formState;
  if(!f.wardUnit || !f.skopKerja){ showToast('Please select a Location and fill in the Job Scope.'); return; }
  if(!f.activityType || !f.riskGroup || !f.icraClass){ showToast('Please complete Activity Type, Risk Group and ICRA Class.'); return; }

  let record;
  const autoPermit = { nama:f.kontraktor, jawatan:'Contractor', syarikat:f.kontraktor, tel:'', tarikh:f.tarikhICRA };
  const autoAuth = { nama:(f.picInCharge||[]).join(', '), jawatan:'PIC UKI', unit:'Unit Kawalan Infeksi', tarikh:f.tarikhICRA };
  if(editingId){
    record = findProject(editingId);
    Object.assign(record, {
      wardUnit:f.wardUnit, location:f.location,
      picInCharge:f.picInCharge, tarikhPraKonsultasi:f.tarikhPraKonsultasi, tarikhICRA:f.tarikhICRA,
      tarikhMula:f.tarikhMula, tarikhTamat:f.tarikhTamat, anggaranTempoh:f.anggaranTempoh,
      kontraktor:f.kontraktor, skopKerja:f.skopKerja, memoFile:f.memoFile, ganttFile:f.ganttFile,
      activityType:f.activityType, riskGroup:f.riskGroup, icraClass:f.icraClass,
      additionalRecommendation:f.additionalRecommendation,
      permit:autoPermit, auth:autoAuth
    });
  } else {
    record = {
      id:uid(), createdAt:new Date().toISOString(), status:'PRA',
      wardUnit:f.wardUnit, location:f.location,
      picInCharge:f.picInCharge, tarikhPraKonsultasi:f.tarikhPraKonsultasi, tarikhICRA:f.tarikhICRA,
      tarikhMula:f.tarikhMula, tarikhTamat:f.tarikhTamat, anggaranTempoh:f.anggaranTempoh,
      kontraktor:f.kontraktor, skopKerja:f.skopKerja, memoFile:f.memoFile, ganttFile:f.ganttFile,
      activityType:f.activityType, riskGroup:f.riskGroup, icraClass:f.icraClass,
      additionalRecommendation:f.additionalRecommendation,
      permit:autoPermit, auth:autoAuth,
      preSignedFile:null,
      duringLogs:[], tcExpectedDate:'', tc:null
    };
  }
  try{
    const saved = await apiSave(record);
    if(editingId){ const idx=projects.findIndex(p=>p.id===saved.id); projects[idx]=saved; }
    else projects.push(saved);
    showToast('ICRA saved successfully.');
    goView('detail', saved.id);
  }catch(e){ showToast('Save failed: '+e.message); }
}

function editProject(id){
  const p = findProject(id); if(!p) return;
  editingId = id;
  formState = {
    wardUnit:p.wardUnit, location:p.location,
    picInCharge:(p.picInCharge||[]).slice(), tarikhPraKonsultasi:p.tarikhPraKonsultasi, tarikhICRA:p.tarikhICRA,
    tarikhMula:p.tarikhMula, tarikhTamat:p.tarikhTamat, anggaranTempoh:p.anggaranTempoh,
    kontraktor:p.kontraktor, skopKerja:p.skopKerja, memoFile:p.memoFile, ganttFile:p.ganttFile,
    activityType:p.activityType, riskGroup:p.riskGroup, icraClass:p.icraClass,
    additionalRecommendation:p.additionalRecommendation||''
  };
  view='form'; render();
}

              ${l.recommendation?`<div style="margin-top:8px;font-size:13px;"><strong>Recommendation:</strong> ${esc(l.recommendation)}</div>`:''}
              <div class="field-hint" style="margin-top:8px;">Upload signed copy (contractor acknowledgement):</div>
              <input type="file" accept="image/*,application/pdf" onchange="handleSignedUpload(this,'${p.id}','during',${idx})">
              ${l.signedFile?`<div style="margin-top:6px;"><a class="attach-link" href="${l.signedFile.url}" target="_blank">&#128206; ${esc(l.signedFile.name)} (signed)</a></div>`:''}
            </div>
          `).join('')}
          <button class="btn btn-outline" onclick="startDuringDraft('${p.id}')">+ Add Construction Visit</button>
          <div id="during-draft-area"></div>
        </div>

        <div class="card" style="padding:20px;">
          <div class="section-title">Testing &amp; Commissioning</div>
          ${renderTCSection(p)}
        </div>
      </div>

      <div>
        <div class="card" style="padding:20px;">
          <div class="section-title">Permit Request By</div>
          <div class="info-row"><span class="k">Name</span><span class="v">${esc(p.permit.nama)||'&mdash;'}</span></div>
          <div class="info-row"><span class="k">Position</span><span class="v">${esc(p.permit.jawatan)||'&mdash;'}</span></div>
          <div class="info-row"><span class="k">Company/Unit</span><span class="v">${esc(p.permit.syarikat)||'&mdash;'}</span></div>
          <div class="info-row"><span class="k">Contact</span><span class="v">${esc(p.permit.tel)||'&mdash;'}</span></div>
          <div class="info-row"><span class="k">Date</span><span class="v">${fmtDate(p.permit.tarikh)}</span></div>
        </div>
        <div class="card" style="padding:20px;margin-top:18px;">
          <div class="section-title">ICRA Authorized By</div>
          <div class="info-row"><span class="k">Name</span><span class="v">${esc(p.auth.nama)||'&mdash;'}</span></div>
          <div class="info-row"><span class="k">Position</span><span class="v">${esc(p.auth.jawatan)||'&mdash;'}</span></div>
          <div class="info-row"><span class="k">Unit</span><span class="v">${esc(p.auth.unit)||'&mdash;'}</span></div>
          <div class="info-row"><span class="k">Date</span><span class="v">${fmtDate(p.auth.tarikh)}</span></div>
        </div>
      </div>
    </div>
  `;
}

/* ---- During Construction: draft visit with multiple findings + photos ---- */
function startDuringDraft(pid){
  duringDraft = { pid, tarikh:todayISO(), findings:[{text:'',photos:[]}], recommendation:'' };
  renderDuringDraft();
}
function renderDuringDraft(){
  const el = document.getElementById('during-draft-area');
  if(!duringDraft){ el.innerHTML=''; return; }
  el.innerHTML = `
    <div class="visit-card" style="margin-top:12px;background:var(--orange-50);">
      <label class="field-label">Visit Date</label>
      <div class="field"><input type="date" value="${duringDraft.tarikh}" oninput="duringDraft.tarikh=this.value"></div>
      <div id="findings-list">${duringDraftFindingsHtml()}</div>
      <button class="btn btn-outline btn-sm" onclick="addDuringFinding()">+ Add Another Finding</button>
      <div class="field" style="margin-top:12px;"><label class="field-label">Overall Recommendation</label>
        <textarea oninput="duringDraft.recommendation=this.value">${esc(duringDraft.recommendation)}</textarea></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline" onclick="duringDraft=null; renderDuringDraft()">Cancel</button>
        <button class="btn btn-primary" onclick="saveDuringDraft()">Save Visit</button>
      </div>
    </div>
  `;
}
function duringDraftFindingsHtml(){
  return duringDraft.findings.map((fnd,i)=>`
    <div class="finding-block">
      <label class="field-label">Finding ${i+1}</label>
      <textarea oninput="duringDraft.findings[${i}].text=this.value" placeholder="Describe the finding&hellip;">${esc(fnd.text)}</textarea>
      <input type="file" accept="image/*" capture="environment" multiple onchange="handleFindingPhotos(this,${i})">
      <div class="photo-thumb-row" id="finding-photos-${i}">${fnd.photos.map(ph=>`<img class="photo-thumb" src="${ph.thumb}" alt="">`).join('')}</div>
      ${duringDraft.findings.length>1?`<button class="btn-ghost btn btn-sm" onclick="removeDuringFinding(${i})">Remove finding</button>`:''}
    </div>
  `).join('');
}
function addDuringFinding(){ duringDraft.findings.push({text:'',photos:[]}); renderDuringDraft(); }
function removeDuringFinding(i){ duringDraft.findings.splice(i,1); renderDuringDraft(); }
async function handleFindingPhotos(input, i){
  const files = Array.from(input.files||[]);
  for(const file of files){
    try{
      const base64 = await fileToBase64(file);
      const res = await apiUploadFile(file.name, file.type, base64);
      duringDraft.findings[i].photos.push({name:file.name, url:res.url, thumb:res.thumb});
    }catch(e){ showToast('Photo upload failed: '+e.message); }
  }
  document.getElementById('finding-photos-'+i).innerHTML = duringDraft.findings[i].photos.map(ph=>`<img class="photo-thumb" src="${ph.thumb}" alt="">`).join('');
}
async function saveDuringDraft(){
  const p = findProject(duringDraft.pid); if(!p) return;
  const hasText = duringDraft.findings.some(f=>f.text.trim());
  if(!hasText){ showToast('Please add at least one finding.'); return; }
  p.duringLogs = p.duringLogs || [];
  p.duringLogs.push({ id:uid(), tarikh:duringDraft.tarikh, findings:duringDraft.findings.filter(f=>f.text.trim()), recommendation:duringDraft.recommendation, signedFile:null });
  if(p.status==='PRA') p.status='DALAM';
  try{
    const saved = await apiSave(p);
    const idx = projects.findIndex(x=>x.id===saved.id); projects[idx]=saved;
    duringDraft=null;
    showToast('Visit saved.');
    goView('detail', saved.id);
  }catch(e){ showToast('Save failed: '+e.message); }
}

/* ---- Testing & Commissioning ---- */
function renderTCSection(p){
  if(p.tc){
    return `
      <div class="info-row"><span class="k">T&amp;C Date</span><span class="v">${fmtDate(p.tc.tarikh)}</span></div>
      <div style="margin-top:10px;font-size:13.5px;line-height:1.6;">${esc(p.tc.dapatan)}</div>
      <div style="margin-top:10px;">
        <button class="btn btn-outline btn-sm" onclick="printReport('${p.id}','tc')">Print T&amp;C Report</button>
      </div>
      <div class="field-hint" style="margin-top:10px;">Upload signed T&amp;C form:</div>
      <input type="file" accept="image/*,application/pdf" onchange="handleSignedUpload(this,'${p.id}','tc')">
      ${p.tc.signedFile?`<div style="margin-top:6px;"><a class="attach-link" href="${p.tc.signedFile.url}" target="_blank">&#128206; ${esc(p.tc.signedFile.name)} (signed)</a></div>`:''}
    `;
  }
  return `
    <p class="section-sub" style="margin-top:6px;">Not yet recorded.</p>
    <label class="field-label">Expected T&amp;C Date</label>
    <div class="field"><input type="date" id="tc-expected-${p.id}" value="${p.tcExpectedDate||todayISO()}" onchange="setTCExpected('${p.id}',this.value)"></div>
    <label class="field-label">Actual T&amp;C Date</label>
    <div class="field"><input type="date" id="tc-tarikh-${p.id}" value="${todayISO()}"></div>
    <label class="field-label">Findings / Recommendation</label>
    <div class="field"><textarea id="tc-dapatan-${p.id}" placeholder="Findings &amp; recommendations during testing &amp; commissioning&hellip;"></textarea></div>
    <button class="btn btn-outline" onclick="addTC('${p.id}')">Save T&amp;C Record</button>
  `;
}
async function setTCExpected(id,val){
  const p = findProject(id); if(!p) return;
  p.tcExpectedDate = val;
  try{ const saved=await apiSave(p); const idx=projects.findIndex(x=>x.id===saved.id); projects[idx]=saved; }catch(e){ showToast('Save failed: '+e.message); }
}
async function addTC(id){
  const p = findProject(id); if(!p) return;
  const tarikh = document.getElementById('tc-tarikh-'+id).value;
  const dapatan = document.getElementById('tc-dapatan-'+id).value.trim();
  if(!dapatan){ showToast('Please fill in the T&C findings/recommendation.'); return; }
  p.tc = {tarikh, dapatan, signedFile:null};
  p.status='TC';
  try{
    const saved = await apiSave(p); const idx=projects.findIndex(x=>x.id===saved.id); projects[idx]=saved;
    showToast('T&C record saved.'); goView('detail', saved.id);
  }catch(e){ showToast('Save failed: '+e.message); }
}

/* ---- shared: status update, delete, signed-file upload ---- */
async function updateStatus(id, status){
  const p=findProject(id); if(!p) return;
  p.status=status;
  try{ const saved=await apiSave(p); const idx=projects.findIndex(x=>x.id===saved.id); projects[idx]=saved; showToast('Project status updated.'); renderMain(); }
  catch(e){ showToast('Save failed: '+e.message); }
}
async function deleteProjectUI(id){
  if(!confirm('Delete this project permanently?')) return;
  try{ await apiDelete(id); projects=projects.filter(p=>p.id!==id); showToast('Project deleted.'); goView('dashboard'); }
  catch(e){ showToast('Delete failed: '+e.message); }
}
async function handleSignedUpload(input, pid, stage, visitIdx){
  const file = input.files[0]; if(!file) return;
  const p = findProject(pid); if(!p) return;
  try{
    const base64 = await fileToBase64(file);
    const res = await apiUploadFile(file.name, file.type, base64);
    const fileRef = {name:file.name, url:res.url};
    if(stage==='pre') p.preSignedFile = fileRef;
    else if(stage==='tc') p.tc.signedFile = fileRef;
    else if(stage==='during') p.duringLogs[visitIdx].signedFile = fileRef;
    const saved = await apiSave(p); const idx=projects.findIndex(x=>x.id===saved.id); projects[idx]=saved;
    showToast('Signed copy uploaded.'); renderMain();
  }catch(e){ showToast('Upload failed: '+e.message); }
}

/* ============================================================
   MATRIX GUIDE
   ============================================================ */
function renderGuide(main){
  main.innerHTML = `
    <div class="card" style="padding:24px;margin-bottom:18px;">
      <div class="section-title">Reference</div>
      <h2 style="margin:2px 0 12px 0;font-size:20px;">IC Matrix &ndash; Infection Control Class</h2>
      <div style="overflow-x:auto;"><table class="matrix-table">
        <thead><tr><th>Patient Risk Group</th><th>Type A</th><th>Type B</th><th>Type C</th><th>Type D</th></tr></thead>
        <tbody>${Object.keys(RISK_GROUPS).map(rk=>`<tr><td>${RISK_GROUPS[rk].title}</td>
          ${['A','B','C','D'].map(ak=>`<td>${MATRIX[rk][ak].map(c=>`<span class="class-badge c-${c}">${c}</span>`).join(' / ')}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="card" style="padding:24px;margin-bottom:18px;">
      <h2 style="margin:2px 0 12px 0;font-size:18px;">Construction Activity Types</h2>
      <div class="choice-grid">${Object.keys(ACTIVITY_TYPES).map(k=>{const a=ACTIVITY_TYPES[k];
        return `<div class="choice-card"><div class="choice-head"><div class="choice-letter" style="${intensityStyleAttr(a.intensity)}">${k}</div><div class="choice-title">${a.title}</div></div><p class="choice-desc">${a.desc}</p></div>`;}).join('')}</div>
    </div>
    <div class="card" style="padding:24px;margin-bottom:18px;">
      <h2 style="margin:2px 0 12px 0;font-size:18px;">Patient Risk Groups</h2>
      <div class="choice-grid">${Object.keys(RISK_GROUPS).map(k=>{const r=RISK_GROUPS[k];
        return `<div class="choice-card" style="background:${RISK_COLOR_STYLE[k].bg};"><div class="choice-head"><div class="choice-letter" style="background:#fff;color:${RISK_COLOR_STYLE[k].color};font-size:10px;">${r.intensity}</div><div class="choice-title" style="color:${RISK_COLOR_STYLE[k].color};">${r.title}</div></div><p class="choice-examples" style="color:${RISK_COLOR_STYLE[k].color};opacity:0.85;">${r.locations.join(' &middot; ')}</p></div>`;}).join('')}</div>
    </div>
    <div class="card" style="padding:24px;">
      <h2 style="margin:2px 0 12px 0;font-size:18px;">Controls by Class</h2>
      ${['I','II','III','IV'].map(c=>`<div style="margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--line);">
        <span class="class-badge c-${c}" style="font-size:14px;padding:6px 16px;">Class ${c}</span>
        <div class="precaution-cols"><div><h4>During Construction</h4><ul>${CLASS_PRECAUTIONS[c].during.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div><h4>Upon Completion</h4><ul>${CLASS_PRECAUTIONS[c].completion.map(x=>`<li>${x}</li>`).join('')}</ul></div></div></div>`).join('')}
    </div>
  `;
}

/* ============================================================
   FEEDBACK
   ============================================================ */
function renderFeedback(main){
  main.innerHTML = `
    <div class="card" style="padding:24px;max-width:560px;margin:0 auto;">
      <div class="section-title">Feedback</div>
      <h2 style="margin:2px 0 8px 0;font-size:20px;">Tell us what to improve</h2>
      <p class="section-sub">Feedback is saved to the Feedback sheet alongside your project data.</p>
      <div class="field"><label class="field-label">Name (optional)</label><input type="text" id="fb-name"></div>
      <div class="field"><label class="field-label">Feedback</label><textarea id="fb-message" placeholder="What worked, what didn't, what you'd like to see&hellip;"></textarea></div>
      <button class="btn btn-primary" onclick="submitFeedback()">Send Feedback</button>
    </div>
  `;
}
async function submitFeedback(){
  const name = document.getElementById('fb-name').value.trim();
  const message = document.getElementById('fb-message').value.trim();
  if(!message){ showToast('Please write your feedback first.'); return; }
  try{ await apiFeedback({name,message}); showToast('Thanks — feedback sent!'); goView('dashboard'); }
  catch(e){ showToast('Could not send feedback: '+e.message); }
}

/* ============================================================
   PRINT
   ============================================================ */
function printReport(id, stage, visitIdx){
  const p = findProject(id); if(!p) return;
  const area = document.getElementById('printArea');
  const hasClass = p.icraClass && CLASS_PRECAUTIONS[p.icraClass];
  let body = `<h2>ICRA &ndash; ${esc(p.wardUnit)}</h2><p><strong>Infection Control Unit, Hospital Tengku Permaisuri Norashikin</strong></p>`;
  const baseTable = `<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;" border="1" cellpadding="6">
    <tr><td>Ward/Unit</td><td colspan="3">${esc(p.wardUnit)}</td></tr>
    <tr><td>PIC In-Charge</td><td>${esc((p.picInCharge||[]).join(', '))}</td><td>Contractor</td><td>${esc(p.kontraktor)}</td></tr>
    <tr><td>ICRA Class</td><td colspan="3"><strong>${hasClass?'Class '+p.icraClass:'Not yet classified'}</strong>${p.activityType?' (Activity '+p.activityType+')':''}${RISK_GROUPS[p.riskGroup]?' &middot; '+RISK_GROUPS[p.riskGroup].title:''}</td></tr>
    <tr><td>Job Scope</td><td colspan="3">${esc(p.skopKerja)}</td></tr>
  </table>`;

  if(stage==='pre'){
    body += baseTable;
    if(hasClass){
      body += `<h3 style="margin-top:16px;">During Construction</h3><ul>${CLASS_PRECAUTIONS[p.icraClass].during.map(x=>`<li>${x}</li>`).join('')}</ul>`;
      body += `<h3>Upon Completion</h3><ul>${CLASS_PRECAUTIONS[p.icraClass].completion.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    }
    if(p.additionalRecommendation) body += `<h3>Additional Recommendation</h3><p>${esc(p.additionalRecommendation)}</p>`;
    body += `<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:16px;" border="1" cellpadding="6">
      <tr><td><strong>Permit Request By:</strong><br>${esc(p.permit.nama)}<br>${esc(p.permit.jawatan)}<br>${esc(p.permit.syarikat)}<br>${fmtDate(p.permit.tarikh)}</td>
      <td><strong>ICRA Authorized By:</strong><br>${esc(p.auth.nama)}<br>${esc(p.auth.jawatan)}<br>${esc(p.auth.unit)}<br>${fmtDate(p.auth.tarikh)}</td></tr></table>`;
  } else if(stage==='during'){
    const l = p.duringLogs[visitIdx];
    body += `<h3>During Construction Assessment &ndash; Visit ${visitIdx+1}</h3>`;
    body += baseTable;
    body += `<p><strong>Visit Date:</strong> ${fmtDate(l.tarikh)}</p>`;
    body += `<h3>Findings</h3><ol>${l.findings.map(f=>`<li>${esc(f.text)}</li>`).join('')}</ol>`;
    body += `<h3>Recommendation</h3><p>${esc(l.recommendation)}</p>`;
    body += `<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:16px;" border="1" cellpadding="6">
      <tr><td><strong>Permit Request By:</strong><br>${esc(p.permit.nama)}</td><td><strong>ICRA Authorized By:</strong><br>${esc(p.auth.nama)}</td></tr></table>`;
  } else if(stage==='tc'){
    body += `<h3>Testing &amp; Commissioning</h3>`;
    body += baseTable;
    body += `<p><strong>T&amp;C Date:</strong> ${fmtDate(p.tc.tarikh)}</p>`;
    body += `<h3>Findings / Recommendation</h3><p>${esc(p.tc.dapatan)}</p>`;
    body += `<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:16px;" border="1" cellpadding="6">
      <tr><td><strong>Permit Request By:</strong><br>${esc(p.permit.nama)}</td><td><strong>ICRA Authorized By:</strong><br>${esc(p.auth.nama)}</td></tr></table>`;
  }
  area.innerHTML = body;
  document.body.classList.add('printing');
  window.print();
}
window.onafterprint = ()=> document.body.classList.remove('printing');

/* ============================================================
   INIT
   ============================================================ */
(async function boot(){
  await loadConfig();
  await loadCurrentAuditor();
  view = 'splash';
  render();
  const splashStart = Date.now();
  await initApp();
  const minSplashMs = 2400;
  const elapsed = Date.now() - splashStart;
  if(elapsed < minSplashMs) await new Promise(r=>setTimeout(r, minSplashMs - elapsed));
  view = currentAuditor ? 'dashboard' : 'auditor';
  render();
})();
</script>
</body>
</html>
